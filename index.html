<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کد نیمز (Codenames)</title>
    <style>
        :root {
            --red: #ef4444;
            --red-dark: #b91c1c;
            --blue: #3b82f6;
            --blue-dark: #1d4ed8;
            --neutral: #d1d5db;
            --neutral-text: #4b5563;
            --black: #18181b;
            --bg: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Tahoma, 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .header {
            width: 100%;
            max-width: 960px;
            background: #ffffff;
            border-radius: 16px;
            padding: 15px 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .scoreboard { display: flex; align-items: center; gap: 20px; font-weight: bold; }
        .score-box {
            display: flex; flex-direction: column; align-items: center; padding: 8px 18px; border-radius: 12px; min-width: 130px;
        }
        .score-box.red { background-color: #fef2f2; border: 2px solid var(--red); color: var(--red-dark); }
        .score-box.blue { background-color: #eff6ff; border: 2px solid var(--blue); color: var(--blue-dark); }
        .score-title { font-size: 13px; margin-bottom: 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
        .score-numbers { font-size: 20px; }
        .wins-badge { font-size: 12px; background: rgba(0,0,0,0.08); padding: 2px 8px; border-radius: 20px; margin-top: 4px; }
        
        .center-info { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .starter-info { font-size: 14px; font-weight: bold; padding: 6px 14px; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0; }
        .timer-display { font-size: 14px; font-weight: bold; color: #0f172a; background: #e2e8f0; padding: 3px 10px; border-radius: 6px; }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        button {
            font-family: inherit; font-size: 14px; font-weight: bold; padding: 10px 16px; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s;
        }
        .btn-new { background-color: #10b981; color: white; }
        .btn-new:hover { background-color: #059669; }
        .btn-spymaster { background-color: #6366f1; color: white; }
        .btn-spymaster.active { background-color: #312e81; }
        .btn-reset-wins { background-color: #e2e8f0; color: #475569; }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 960px;
            flex-grow: 1;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            min-height: 95px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            color: #1e293b;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0, 0, 0, 0.08); }

        .board.spymaster-mode .card:not(.revealed).red { border: 3px dashed var(--red); background-color: #fef2f2; color: var(--red-dark); }
        .board.spymaster-mode .card:not(.revealed).blue { border: 3px dashed var(--blue); background-color: #eff6ff; color: var(--blue-dark); }
        .board.spymaster-mode .card:not(.revealed).neutral { border: 3px dashed #9ca3af; background-color: #f9fafb; color: #6b7280; }
        .board.spymaster-mode .card:not(.revealed).black { border: 3px dashed #000000; background-color: #3f3f46; color: #ffffff; }

        .card.revealed { transform: scale(0.98); box-shadow: inset 0 2px 6px rgba(0,0,0,0.2); }
        .card.revealed.red { background-color: var(--red); border-color: var(--red-dark); color: white; }
        .card.revealed.blue { background-color: var(--blue); border-color: var(--blue-dark); color: white; }
        .card.revealed.neutral { background-color: var(--neutral); border-color: #9ca3af; color: var(--neutral-text); }
        .card.revealed.black { background-color: var(--black); border-color: #000000; color: white; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: white; padding: 30px 40px; border-radius: 20px; text-align: center; max-width: 450px; width: 90%; box-shadow: 0 20px 25px rgba(0, 0, 0, 0.2);
        }
        .modal h2 { font-size: 24px; margin-bottom: 12px; }
        .modal p { font-size: 15px; color: #475569; margin-bottom: 20px; line-height: 1.6; }
        .modal input {
            width: 100%; padding: 12px; font-size: 16px; font-family: inherit; border: 2px solid #cbd5e1; border-radius: 10px; margin-bottom: 15px; text-align: center; outline: none;
        }
        .modal input:focus { border-color: #3b82f6; }
        .modal-buttons { display: flex; gap: 12px; justify-content: center; }
        .btn-modal-primary { background-color: #10b981; color: white; padding: 12px 24px; font-size: 16px; flex-grow: 1; }
        .btn-modal-secondary { background-color: #e2e8f0; color: #334155; padding: 12px 20px; font-size: 16px; }
        .killer-choice-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn-choice-red { background-color: var(--red); color: white; padding: 12px; font-size: 16px; }
        .btn-choice-blue { background-color: var(--blue); color: white; padding: 12px; font-size: 16px; }
        .word-count-badge { font-size: 12px; color: #64748b; margin-top: 12px; }

        @media (max-width: 650px) {
            .board { gap: 8px; }
            .card { font-size: 15px; min-height: 70px; padding: 5px; border-radius: 10px; }
            .header { justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="scoreboard">
            <div class="score-box red">
                <span class="score-title" id="redTitleDisplay">تیم قرمز</span>
                <div class="score-numbers"><span id="redLeft">0</span></div>
                <span class="wins-badge">بردها: <strong id="redWins">0</strong></span>
            </div>
            <div class="score-box blue">
                <span class="score-title" id="blueTitleDisplay">تیم آبی</span>
                <div class="score-numbers"><span id="blueLeft">0</span></div>
                <span class="wins-badge">بردها: <strong id="blueWins">0</strong></span>
            </div>
        </div>

        <div class="center-info">
            <div class="starter-info" id="starterInfo">شروع‌کننده: ...</div>
            <div class="timer-display" id="timerDisplay">⏱️ 00:00</div>
        </div>

        <div class="actions">
            <button class="btn-spymaster" id="spymasterBtn" onclick="toggleSpymaster()">👁️ نقشه جاسوس‌ارشد</button>
            <button class="btn-new" onclick="startNewRound()">🔄 دست جدید</button>
            <button class="btn-reset-wins" onclick="resetMatchWins()">صفر کردن بردها</button>
        </div>
    </div>

    <div class="board" id="board"></div>
    <div class="word-count-badge" id="bankInfo"></div>

    <div class="modal-overlay show" id="setupModal">
        <div class="modal">
            <h2>تنظیمات اولیه بازی</h2>
            <p>نام تیم‌های خود را وارد کنید:</p>
            <input type="text" id="inputRedName" value="تیم قرمز">
            <input type="text" id="inputBlueName" value="تیم آبی">
            <div class="modal-buttons">
                <button class="btn-modal-primary" onclick="initGameWithNames()">شروع بازی 🚀</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="killerModal">
        <div class="modal">
            <h2>💥 کارت قاتل انتخاب شد!</h2>
            <p>کدام تیم اشتباهاً کارت قاتل را انتخاب کرد؟</p>
            <div class="killer-choice-btns">
                <button class="btn-choice-red" id="killerRedBtn" onclick="handleKillerChoice('red')">تیم قرمز باخت</button>
                <button class="btn-choice-blue" id="killerBlueBtn" onclick="handleKillerChoice('blue')">تیم آبی باخت</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="endModal">
        <div class="modal">
            <h2 id="modalTitle">پایان دست!</h2>
            <p id="modalDesc"></p>
            <div class="modal-buttons">
                <button class="btn-modal-secondary" onclick="closeModal('endModal')">مشاهده تخته</button>
                <button class="btn-modal-primary" onclick="startNewRound()">شروع دست جدید</button>
            </div>
        </div>
    </div>

        const wordBank = Array.from(new Set(curatedWords.filter(w => w.length >= 2 && w.length <= 11)));

        let redTeamName = "تیم قرمز";
        let blueTeamName = "تیم آبی";
        let currentCards = [];
        let redRemaining = 0;
        let blueRemaining = 0;
        let redMatchWins = localStorage.getItem('codenames_red_wins') ? parseInt(localStorage.getItem('codenames_red_wins')) : 0;
        let blueMatchWins = localStorage.getItem('codenames_blue_wins') ? parseInt(localStorage.getItem('codenames_blue_wins')) : 0;
        let isSpymasterMode = false;
        let roundOver = false;

        let timerInterval = null;
        let secondsElapsed = 0;

        const boardEl = document.getElementById('board');
        const redTitleDisplay = document.getElementById('redTitleDisplay');
        const blueTitleDisplay = document.getElementById('blueTitleDisplay');
        const redLeftEl = document.getElementById('redLeft');
        const blueLeftEl = document.getElementById('blueLeft');
        const redWinsEl = document.getElementById('redWins');
        const blueWinsEl = document.getElementById('blueWins');
        const starterInfoEl = document.getElementById('starterInfo');
        const timerDisplay = document.getElementById('timerDisplay');
        const spymasterBtn = document.getElementById('spymasterBtn');
        const setupModal = document.getElementById('setupModal');
        const killerModal = document.getElementById('killerModal');
        const killerRedBtn = document.getElementById('killerRedBtn');
        const killerBlueBtn = document.getElementById('killerBlueBtn');
        const endModal = document.getElementById('endModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');

        redWinsEl.textContent = redMatchWins;
        blueWinsEl.textContent = blueMatchWins;

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initGameWithNames() {
            const rName = document.getElementById('inputRedName').value.trim();
            const bName = document.getElementById('inputBlueName').value.trim();
            if (rName) redTeamName = rName;
            if (bName) blueTeamName = bName;

            redTitleDisplay.textContent = redTeamName;
            blueTitleDisplay.textContent = blueTeamName;
            killerRedBtn.textContent = `باخت ${redTeamName}`;
            killerBlueBtn.textContent = `باخت ${blueTeamName}`;

            setupModal.classList.remove('show');
            startNewRound();
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            timerDisplay.textContent = `⏱️ 00:00`;
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                timerDisplay.textContent = `⏱️ ${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function startNewRound() {
            closeModal('endModal');
            closeModal('killerModal');
            roundOver = false;

            if (isSpymasterMode) {
                toggleSpymaster();
            }

            startTimer();

            const starterTeam = Math.random() < 0.5 ? 'red' : 'blue';
            const starterName = starterTeam === 'red' ? redTeamName : blueTeamName;
            const starterColor = starterTeam === 'red' ? '#ef4444' : '#3b82f6';
            
            starterInfoEl.innerHTML = `شروع‌کننده: <span style="color: ${starterColor};">${starterName} (۹ کلمه)</span>`;

            let colors = ['black'];
            for (let i = 0; i < 7; i++) colors.push('neutral');
            for (let i = 0; i < 8; i++) {
                colors.push('red');
                colors.push('blue');
            }
            colors.push(starterTeam);
            colors = shuffle(colors);

            const selectedWords = shuffle(wordBank).slice(0, 25);

            currentCards = selectedWords.map((word, index) => ({
                word: word,
                color: colors[index],
                revealed: false
            }));

            renderBoard();
            updateScores(false);
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            currentCards.forEach((cardData, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = `card ${cardData.color}`;
                if (cardData.revealed) {
                    cardEl.classList.add('revealed');
                }
                cardEl.textContent = cardData.word;

                cardEl.addEventListener('click', () => handleCardClick(index, cardEl));
                boardEl.appendChild(cardEl);
            });
        }

        function handleCardClick(index, cardEl) {
            if (roundOver) return;
            const card = currentCards[index];
            card.revealed = !card.revealed;

            if (card.revealed) {
                cardEl.classList.add('revealed');
            } else {
                cardEl.classList.remove('revealed');
            }

            if (card.revealed && card.color === 'black') {
                stopTimer();
                killerModal.classList.add('show');
                return;
            }

            updateScores(true);
        }

        function handleKillerChoice(loserTeam) {
            roundOver = true;
            stopTimer();
            killerModal.classList.remove('show');
            const timeStr = timerDisplay.textContent.replace('⏱️ ', '');

            if (loserTeam === 'red') {
                blueMatchWins++;
                localStorage.setItem('codenames_blue_wins', blueMatchWins);
                blueWinsEl.textContent = blueMatchWins;
                showEndModal('💥 کارت قاتل انتخاب شد!', `${redTeamName} کارت قاتل را لمس کرد!\n${blueTeamName} در این دست برنده شد.\n⏱️ زمان بازی: ${timeStr}`, '#3b82f6');
            } else {
                redMatchWins++;
                localStorage.setItem('codenames_red_wins', redMatchWins);
                redWinsEl.textContent = redMatchWins;
                showEndModal('💥 کارت قاتل انتخاب شد!', `${blueTeamName} کارت قاتل را لمس کرد!\n${redTeamName} در این دست برنده شد.\n⏱️ زمان بازی: ${timeStr}`, '#ef4444');
            }
        }

        function updateScores(checkWinCondition) {
            redRemaining = currentCards.filter(c => c.color === 'red' && !c.revealed).length;
            blueRemaining = currentCards.filter(c => c.color === 'blue' && !c.revealed).length;

            redLeftEl.textContent = redRemaining;
            blueLeftEl.textContent = blueRemaining;

            if (checkWinCondition && !roundOver) {
                const timeStr = timerDisplay.textContent.replace('⏱️ ', '');
                if (redRemaining === 0) {
                    roundOver = true;
                    stopTimer();
                    redMatchWins++;
                    localStorage.setItem('codenames_red_wins', redMatchWins);
                    redWinsEl.textContent = redMatchWins;
                    showEndModal('🏆 پیروزی!', `${redTeamName} تمام کلمات خود را پیدا کرد و برنده شد!\n⏱️ زمان بازی: ${timeStr}`, '#ef4444');
                } else if (blueRemaining === 0) {
                    roundOver = true;
                    stopTimer();
                    blueMatchWins++;
                    localStorage.setItem('codenames_blue_wins', blueMatchWins);
                    blueWinsEl.textContent = blueMatchWins;
                    showEndModal('🏆 پیروزی!', `${blueTeamName} تمام کلمات خود را پیدا کرد و برنده شد!\n⏱️ زمان بازی: ${timeStr}`, '#3b82f6');
                }
            }
        }

        function toggleSpymaster() {
            isSpymasterMode = !isSpymasterMode;
            boardEl.classList.toggle('spymaster-mode', isSpymasterMode);
            spymasterBtn.classList.toggle('active', isSpymasterMode);
            spymasterBtn.textContent = isSpymasterMode ? '🙈 بستن نقشه جاسوس‌ارشد' : '👁️ نقشه جاسوس‌ارشد';
        }

        function showEndModal(title, desc, color) {
            modalTitle.textContent = title;
            modalTitle.style.color = color;
            modalDesc.innerText = desc;
            endModal.classList.add('show');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        function resetMatchWins() {
            if (confirm("آیا مطمئن هستید که می‌خواهید امتیاز بردها را صفر کنید؟")) {
                redMatchWins = 0;
                blueMatchWins = 0;
                localStorage.setItem('codenames_red_wins', 0);
                localStorage.setItem('codenames_blue_wins', 0);
                redWinsEl.textContent = '0';
                blueWinsEl.textContent = '0';
            }
        }
